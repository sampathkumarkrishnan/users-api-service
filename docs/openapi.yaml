openapi: 3.0.4
info:
  title: Users API
  description: An ASP.NET Core Web API for managing users
  contact:
    name: Support
    email: support@example.com
  version: v1
paths:
  /Users:
    get:
      tags:
        - Users
      summary: Retrieves all users
      responses:
        '200':
          description: Returns the list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
    post:
      tags:
        - Users
      summary: Creates a new user
      requestBody:
        description: The user data to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '201':
          description: Returns the newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: If the user data is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/Users/{id}':
    get:
      tags:
        - Users
      summary: Retrieves a specific user by their unique identifier
      parameters:
        - name: id
          in: path
          description: The unique identifier of the user
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Returns the requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: If the user is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - Users
      summary: Updates an existing user
      parameters:
        - name: id
          in: path
          description: The unique identifier of the user to update
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: The updated user data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '204':
          description: If the user was successfully updated
        '400':
          description: If the user data is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: If the user is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Users
      summary: Deletes a specific user
      parameters:
        - name: id
          in: path
          description: The unique identifier of the user to delete
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: If the user was successfully deleted
        '404':
          description: If the user is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /Users/search:
    get:
      tags:
        - Users
      summary: Searches for users by name or email
      parameters:
        - name: name
          in: query
          description: Optional name to search for
          schema:
            type: string
        - name: email
          in: query
          description: Optional email to search for
          schema:
            type: string
      responses:
        '200':
          description: Returns the list of matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '400':
          description: If the search parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    UserDTO:
      required:
        - id
      type: object
      properties:
        id:
          type: integer
          description: Gets or sets the unique identifier of the user
          format: int32
        name:
          type: string
          description: Gets or sets the name of the user
          nullable: true
        email:
          type: string
          description: Gets or sets the email address of the user
          nullable: true
      additionalProperties: false
      description: Represents a user data transfer object
tags:
  - name: Users