name: Generate OpenAPI Documentation

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Setup tool manifest
        working-directory: ./Users
        run: |
          if [ ! -f ".config/dotnet-tools.json" ]; then
            dotnet new tool-manifest
          fi

      - name: Install Swashbuckle CLI
        working-directory: ./Users
        run: dotnet tool install Swashbuckle.AspNetCore.Cli --version 10.1.4

      - name: Restore dependencies
        working-directory: ./Users
        run: dotnet restore

      - name: Build project
        working-directory: ./Users
        run: dotnet build --no-restore --configuration Release

      - name: Create docs directory
        run: mkdir -p docs

      - name: Generate OpenAPI spec
        working-directory: ./Users
        run: |
          dotnet swagger tofile --output ../docs/openapi.yaml --yaml bin/Release/net10.0/Users.dll v1

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet docs/openapi.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit OpenAPI documentation
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/openapi.yaml
          git commit -m "chore: update OpenAPI documentation [skip ci]"
          git push
